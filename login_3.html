<!DOCTYPE html>
<html lang="pt_br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="screen">
      <div class="leftside">
        <img src="login.png" alt="login 1" />
      </div>

      <div class="rightside">
        <h1>Crie uma conta</h1>
        <form method="POST" class="valilador">
          <label>
            Digite seu nome:<br />
            <input type="text" name="nome" data-rules="required|min=2" />
          </label>
          <label>
            Digite seu Email:<br />
            <input type="text" name="email" data-rules="required|email" />
          </label>
          <label>
            Digite sua senha:<br />
            <input type="password" name="password" data-rules="min=4" />
          </label>
          <label>
            <input type="submit" value="cadastre-se" />
          </label>
        </form>
        <div>Já tem uma conta? <a href="">faça login</a></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
